<!--
  TANDARA — SITE SHELL
-->

<template id="tandara-site-shell">

  <aside
    class="site-shell"
    id="site-shell"
    data-role="site-shell"
    aria-label="">

    <nav
      class="site-shell__top"
      data-role="language-switch"
      aria-label=""
      hidden>

      <a
        class="site-shell__top-control site-shell__flag-control"
        data-role="hr-link"
        hreflang="hr"
        lang="hr"
        href="#"
        title="Hrvatski">

        <img
          data-role="hr-flag"
          alt="Hrvatski">

      </a>

      <a
        class="site-shell__top-control site-shell__home-control"
        data-role="home-link"
        href="#">

        <img
          data-role="home-icon"
          alt="">

        <span
          class="site-shell__visually-hidden"
          data-role="home-label">
        </span>

      </a>

      <a
        class="site-shell__top-control site-shell__flag-control"
        data-role="en-link"
        hreflang="en"
        lang="en"
        href="#"
        title="English">

        <img
          data-role="en-flag"
          alt="English">

      </a>

    </nav>

    <div
      class="site-shell__title"
      data-role="site-title">
    </div>

    <nav
      class="site-shell__navigation"
      data-role="main-navigation"
      aria-label="">

      <ul class="site-shell__menu">

        <li>
          <img data-role="menu-icon" alt="">
          <a data-nav-key="author" href="#">
            <span></span>
          </a>
        </li>

        <li>
          <img data-role="menu-icon" alt="">
          <a data-nav-key="origin" href="#">
            <span></span>
          </a>
        </li>

        <li>
          <img data-role="menu-icon" alt="">
          <a data-nav-key="genealogy" href="#">
            <span></span>
          </a>
        </li>

        <li>
          <img data-role="menu-icon" alt="">
          <a data-nav-key="facts" href="#">
            <span></span>
          </a>
        </li>

        <li>
          <img data-role="menu-icon" alt="">
          <a data-nav-key="migration" href="#">
            <span></span>
          </a>
        </li>

        <li>
          <img data-role="menu-icon" alt="">
          <a data-nav-key="instructions" href="#">
            <span></span>
          </a>
        </li>

        <li>
          <img data-role="menu-icon" alt="">
          <a data-nav-key="contact" href="#">
            <span></span>
          </a>
        </li>

        <li>
          <img data-role="menu-icon" alt="">
          <a data-nav-key="guestbook" href="#">
            <span></span>
          </a>
        </li>

        <li>
          <img data-role="menu-icon" alt="">
          <a data-nav-key="privacy" href="#">
            <span></span>
          </a>
        </li>

      </ul>

    </nav>

    <div
      class="site-shell__author-row"
      data-role="author"
      hidden>

      <div
        class="site-shell__author-label"
        data-role="author-label">
      </div>

      <a
        class="site-shell__author-photo"
        data-role="author-link"
        href="#">

        <img
          data-role="author-image"
          alt="Jure Tandara"
          loading="lazy"
          decoding="async">

      </a>

      <div class="site-shell__author-name">
        <span>Jure</span>
        <span>Tandara</span>
      </div>

    </div>

    <div
      class="site-shell__flagbox"
      data-role="flag-counter">

      <div
        class="site-shell__flag-title"
        data-role="flag-counter-title">
      </div>

      <a
        href="https://info.flagcounter.com/OyvA"
        target="_blank"
        rel="noopener noreferrer"
        referrerpolicy="no-referrer">

        <img
          data-role="flag-counter-image"
          alt=""
          loading="lazy"
          decoding="async"
          referrerpolicy="no-referrer"
          data-flag-counter-src="https://s01.flagcounter.com/countxl/OyvA/bg_FFFFFF/txt_000000/border_CCCCCC/columns_4/maxflags_50/viewers_0/labels_0/pageviews_0/flags_1/percent_0/">

      </a>

    </div>

    <span
      class="site-shell__visually-hidden"
      aria-hidden="true">
    </span>

  </aside>

</template>
